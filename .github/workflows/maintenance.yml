name: Maintenance

# Light monthly validation against dependency/toolchain drift.
# This workflow never deploys; Cloudflare Workers Builds handles deployment.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

concurrency:
  group: maintenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type and content checks
        run: npm run check

      - name: Preview fail-safe build
        run: npm run build

      - name: Production build smoke test
        run: npm run build
        env:
          WORKERS_CI_BRANCH: main
          SITE_URL: https://example.com

      - name: Project initializer smoke test
        run: |
          npm run init:project -- --slug foundation-smoke-test --name "Foundation Smoke Test" --lang es
          grep -q '"name": "foundation-smoke-test"' package.json
          grep -q '"name": "foundation-smoke-test"' wrangler.jsonc
          grep -q 'name: "Foundation Smoke Test"' src/config/site.ts
